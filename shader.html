<!DOCTYPE html>

<html lang="en">
<head><link href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23D4FF00'/%3E%3Ccircle cx='12' cy='12' r='4' fill='%23000'/%3E%3C/svg%3E" rel="icon"/><title>Безопасное Небо — демо шейдера</title>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com/3.4.17?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_SHADER_START:ANIMATION_1 class="fixed inset-0 w-full h-full" -->
<div class="fixed inset-0 w-full h-full" style="display:block;">
<canvas id="shader-canvas-ANIMATION_1" style="display:block;width:100%;height:100%"></canvas>
<script>
(function() {
  const canvas = document.getElementById('shader-canvas-ANIMATION_1');

  // Sync the WebGL drawing-buffer size with the CSS-driven layout size.
  // This fires on initial layout and whenever the element is resized.
  function syncSize() {
    const w = canvas.clientWidth  || 1280;
    const h = canvas.clientHeight || 720;
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width  = w;
      canvas.height = h;
    }
  }
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(syncSize).observe(canvas);
  }
  syncSize();

  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) return;
  const vs = `attribute vec2 a_position;
varying vec2 v_texCoord;
void main() {
  v_texCoord = a_position * 0.5 + 0.5;
  gl_Position = vec4(a_position, 0.0, 1.0);
}`;
  const fs = `precision highp float;
uniform float u_time;
uniform vec2 u_resolution;
uniform vec2 u_mouse;

// Radar sweep and pulsing radar rings aesthetic for Безопасное Небо
void main() {
    vec2 st = (gl_FragCoord.xy - 0.5 * u_resolution.xy) / min(u_resolution.x, u_resolution.y);
    
    // Distance and angle from center
    float dist = length(st);
    float angle = atan(st.y, st.x); // -PI to PI
    
    // Rotation sweep
    float speed = 1.0;
    float sweepAngle = mod(angle - u_time * speed, 6.28318530718);
    float sweep = clamp(1.0 - sweepAngle / 4.5, 0.0, 1.0);
    sweep = pow(sweep, 3.5);
    
    // Concentric radar rings
    float ring1 = abs(dist - 0.22);
    float ring2 = abs(dist - 0.44);
    float ring3 = abs(dist - 0.66);
    float ring4 = abs(dist - 0.88);
    
    float rings = smoothstep(0.006, 0.001, ring1) * 0.4 +
                  smoothstep(0.006, 0.001, ring2) * 0.35 +
                  smoothstep(0.006, 0.001, ring3) * 0.3 +
                  smoothstep(0.006, 0.001, ring4) * 0.2;
                  
    // Crosshair grid lines
    float crosshair = smoothstep(0.003, 0.0, abs(st.x)) * smoothstep(0.9, 0.2, dist) * 0.15 +
                      smoothstep(0.003, 0.0, abs(st.y)) * smoothstep(0.9, 0.2, dist) * 0.15;
                      
    // Pulsing airport blips / nodes
    vec2 p1 = vec2(0.25, 0.18);
    vec2 p2 = vec2(-0.32, 0.28);
    vec2 p3 = vec2(0.12, -0.35);
    vec2 p4 = vec2(-0.22, -0.22);
    vec2 p5 = vec2(0.48, -0.15);
    
    float blip1 = smoothstep(0.02, 0.002, length(st - p1)) * (0.6 + 0.4 * sin(u_time * 3.0));
    float blip2 = smoothstep(0.02, 0.002, length(st - p2)) * (0.6 + 0.4 * sin(u_time * 2.5 + 1.0));
    float blip3 = smoothstep(0.02, 0.002, length(st - p3)) * (0.6 + 0.4 * sin(u_time * 3.2 + 2.0));
    float blip4 = smoothstep(0.02, 0.002, length(st - p4)) * (0.6 + 0.4 * sin(u_time * 2.8 + 3.0));
    float blip5 = smoothstep(0.02, 0.002, length(st - p5)) * (0.6 + 0.4 * sin(u_time * 3.5 + 4.0));
    
    // Blip pulse rings
    float pulse1 = smoothstep(0.005, 0.0, abs(length(st - p1) - mod(u_time * 0.15, 0.15))) * (1.0 - mod(u_time * 0.15, 0.15) / 0.15) * 0.5;
    float pulse2 = smoothstep(0.005, 0.0, abs(length(st - p2) - mod(u_time * 0.18 + 0.05, 0.18))) * (1.0 - mod(u_time * 0.18 + 0.05, 0.18) / 0.18) * 0.5;
    
    float blips = blip1 + blip2 + blip3 + blip4 + blip5 + pulse1 + pulse2;

    // Neon lime accent color: #D4FF00 -> rgb(0.831, 1.0, 0.0)
    vec3 lime = vec3(0.831, 1.0, 0.0);
    vec3 deepBg = vec3(0.039, 0.039, 0.043); // #0A0A0B
    
    // Fade at circular border
    float mask = smoothstep(0.95, 0.8, dist);
    
    // Combine layers
    float intensity = (sweep * 0.28 + rings + crosshair + blips * 1.5) * mask;
    
    vec3 color = mix(deepBg, lime, clamp(intensity, 0.0, 1.0));
    
    // Add subtle ambient radar glow
    color += lime * 0.05 * sweep * mask;
    
    gl_FragColor = vec4(color, 1.0);
}
`;
  function cs(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, cs(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, cs(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const pos = gl.getAttribLocation(prog, 'a_position');
  gl.enableVertexAttribArray(pos);
  gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
  const uTime = gl.getUniformLocation(prog, 'u_time');
  const uRes = gl.getUniformLocation(prog, 'u_resolution');
  const uMouse = gl.getUniformLocation(prog, 'u_mouse');

  // u_mouse is in pixel coordinates matching u_resolution (ShaderToy convention).
  // Shaders that need normalized coords should use: u_mouse / u_resolution.
  let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
  window.addEventListener('mousemove', (event) => {
    const rect = canvas.getBoundingClientRect();
    if (rect.width && rect.height) {
      const nx = (event.clientX - rect.left) / rect.width;
      const ny = 1.0 - (event.clientY - rect.top) / rect.height;
      mouse.x = nx * canvas.width;
      mouse.y = ny * canvas.height;
    }
  });

  function render(t) {
    if (typeof ResizeObserver === 'undefined') syncSize();
    gl.viewport(0, 0, canvas.width, canvas.height);
    if (uTime) gl.uniform1f(uTime, t * 0.001);
    if (uRes) gl.uniform2f(uRes, canvas.width, canvas.height);
    if (uMouse) gl.uniform2f(uMouse, mouse.x, mouse.y);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
  }
  render(0);
})();
</script>
</div>
<!-- STITCH_SHADER_END:ANIMATION_1 -->
</body>
</html>
